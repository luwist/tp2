<header class="header">
  <a routerLink="/" class="logo">dessin</a>

  <div class="actions">
    @if (user()?.role === 'admin') {
      <a
        pButton
        severity="secondary"
        routerLink="/admin"
        routerLinkActive="header__admin-btn--active"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="6" height="6" rx="1.5" stroke="#17171F" stroke-width="1.6" />
          <rect x="11" y="3" width="6" height="6" rx="1.5" stroke="#17171F" stroke-width="1.6" />
          <rect x="3" y="11" width="6" height="6" rx="1.5" stroke="#17171F" stroke-width="1.6" />
          <rect x="11" y="11" width="6" height="6" rx="1.5" stroke="#17171F" stroke-width="1.6" />
        </svg>
        <span>Dashboard</span>
      </a>
    }

    <button pButton severity="secondary" (click)="createDialogVisible.set(true)">
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M15 10.625H5A.63.63 0 0 1 4.375 10 .63.63 0 0 1 5 9.375h10a.63.63 0 0 1 .625.625.63.63 0 0 1-.625.625"
          fill="#17171F"
        />
        <path
          d="M10 15.625A.63.63 0 0 1 9.375 15V5A.63.63 0 0 1 10 4.375a.63.63 0 0 1 .625.625v10a.63.63 0 0 1-.625.625"
          fill="#17171F"
        />
      </svg>

      Crear
    </button>

    <!-- <div class="avatar">
      <img [src]="auth.user()?.avatarUrl" alt="" />
    </div> -->
    <app-user-menu />
  </div>
</header>

<app-create-post [(visible)]="createDialogVisible" />
