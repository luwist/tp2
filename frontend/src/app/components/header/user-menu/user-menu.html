@if (user(); as user) {
  <button
    type="button"
    class="user-menu__trigger"
    aria-label="Abrir menú de usuario"
    aria-haspopup="true"
    (click)="popover.toggle($event)"
  >
    <img class="user-menu__avatar" [src]="user.avatarUrl" alt="" />
  </button>

  <p-popover #popover>
    <div class="user-menu__panel">
      <div class="user-menu__profile">
        <img class="user-menu__avatar user-menu__avatar--large" [src]="user.avatarUrl" alt="" />
        <div class="user-menu__identity">
          <span class="user-menu__name">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="user-menu__username">&#64;{{ user.username }}</span>
        </div>
      </div>

      <hr class="user-menu__divider" />

      <a class="user-menu__item" [routerLink]="['/', user.username]">
        <span class="user-menu__item-icon user-menu__item-icon--profile">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </span>
        Mi perfil
      </a>

      <button type="button" class="user-menu__item" (click)="logout(popover)">
        <span class="user-menu__item-icon user-menu__item-icon--logout">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </span>
        Cerrar sesión
      </button>
    </div>
  </p-popover>
}
