<p-toast position="top-center">
  <ng-template let-message #message>
    <!-- <p>erorrrrr</p> -->
    <p>{{ message.summary }}</p>
    <!-- <p>{{ message.data.fileName }}</p> -->
  </ng-template>
</p-toast>

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '800px' }"
  (onHide)="onHide()"
  [dismissableMask]="true"
>
  <ng-template #header>
    <div class="post-author">
      <img class="post-author__avatar" [src]="auth.user()?.avatarUrl ?? ''" alt="" />

      <div class="post-author__info">
        <span class="post-author__name"
          >{{ auth.user()?.firstName ?? '' }} {{ auth.user()?.lastName ?? '' }}</span
        >
        <span class="post-author__handle">&#64;{{ auth.user()?.username ?? '' }}</span>
      </div>
    </div>
  </ng-template>

  <form class="post-composer" [formGroup]="form">
    <input
      class="post-composer__title"
      formControlName="title"
      placeholder="¿Qué estás creando?"
      maxlength="120"
    />

    <textarea
      class="post-composer__description"
      formControlName="body"
      placeholder="Compartí tu proceso, inspiración o ideas..."
    ></textarea>

    <app-post-image-list [images]="images()" (removed)="removeImage($event)" />

    <app-image-upload-button
      [disabled]="isImageLimitReached()"
      (filesSelected)="onFilesSelected($event)"
      (filesRejected)="onFilesRejected($event)"
    />
  </form>

  <ng-template #footer>
    <div class="post-composer__footer">
      <button
        pButton
        type="button"
        severity="secondary"
        label="Cancelar"
        (click)="close()"
      ></button>

      <button pButton [disabled]="form.invalid || isLoading()" (click)="onPublish()">
        @if (isLoading()) {
          <div class="spinner">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22 12C22 13.3132 21.7413 14.6136 21.2388 15.8268C20.7362 17.0401 19.9997 18.1425 19.0711 19.0711C18.1425 19.9997 17.0401 20.7362 15.8268 21.2388C14.6136 21.7413 13.3132 22 12 22"
                stroke="white"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
        } @else {
          Publicar
        }
      </button>
    </div>
  </ng-template>
</p-dialog>
