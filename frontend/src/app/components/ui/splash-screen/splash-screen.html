<div class="splash">
  <div class="splash__shape splash__shape--pink-corner" aria-hidden="true"></div>

  <svg class="splash__squiggle" viewBox="0 0 110 40" aria-hidden="true">
    <path
      d="M3 26 Q 15 4 27 26 T 51 26 T 75 26 T 99 26"
      fill="none"
      stroke="currentColor"
      stroke-width="4"
      stroke-linecap="round"
    />
  </svg>

  <div class="splash__shape splash__shape--green-circle" aria-hidden="true"></div>

  <svg class="splash__triangle splash__triangle--outline" viewBox="0 0 52 48" aria-hidden="true">
    <path
      d="M26 4 L48 44 L4 44 Z"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </svg>

  <div class="splash__shape splash__shape--violet-arc" aria-hidden="true"></div>
  <div class="splash__shape splash__shape--pink-circle" aria-hidden="true"></div>

  <svg class="splash__triangle splash__triangle--solid" viewBox="0 0 104 92" aria-hidden="true">
    <path d="M52 2 L102 92 L2 92 Z" fill="currentColor" />
  </svg>

  <div class="splash__shape splash__shape--yellow-ring" aria-hidden="true"></div>
  <div class="splash__shape splash__shape--violet-square" aria-hidden="true"></div>
  <div class="splash__shape splash__shape--yellow-dot" aria-hidden="true"></div>
  <div class="splash__shape splash__shape--green-dot" aria-hidden="true"></div>

  <div class="splash__content">
    <svg class="splash__mark" viewBox="0 0 100 80" aria-hidden="true">
      <circle class="splash__mark-part splash__mark-part--pink" cx="30" cy="44" r="28" />
      <path class="splash__mark-part splash__mark-part--green" d="M54 78 L74 14 L98 78 Z" />
      <rect
        class="splash__mark-part splash__mark-part--yellow"
        x="40"
        y="2"
        width="22"
        height="22"
        rx="4"
        transform="rotate(14 51 13)"
      />
    </svg>

    <p class="splash__logo" aria-hidden="true">
      @for (letter of letters; track $index) {
        <span class="splash__letter" [style.--index]="$index">{{ letter }}</span>
      }
    </p>

    <svg class="splash__curve" viewBox="0 0 340 44" aria-hidden="true">
      <line class="splash__curve-handle" x1="12" y1="32" x2="70" y2="8" />
      <line class="splash__curve-handle" x1="328" y1="26" x2="250" y2="6" />
      <path class="splash__curve-path" pathLength="1" d="M12 32 C 70 8, 250 6, 328 26" />
      <circle class="splash__curve-point" cx="70" cy="8" r="4" />
      <circle class="splash__curve-point" cx="250" cy="6" r="4" />
      <rect class="splash__curve-anchor" x="6" y="26" width="12" height="12" />
      <rect class="splash__curve-anchor" x="322" y="20" width="12" height="12" />
    </svg>
  </div>

  <p class="splash__status" role="status">Cargando dessin</p>
</div>
