<div class="splash">
  <svg class="splash__doodle splash__doodle--squiggle" viewBox="0 0 110 40" aria-hidden="true">
    <path
      d="M3 26 Q 15 4 27 26 T 51 26 T 75 26 T 99 26"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
    />
  </svg>

  <svg class="splash__doodle splash__doodle--star" viewBox="0 0 48 48" aria-hidden="true">
    <path
      d="M24 2 L28.5 19.5 L46 24 L28.5 28.5 L24 46 L19.5 28.5 L2 24 L19.5 19.5 Z"
      fill="currentColor"
      stroke="#18181b"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </svg>

  <div class="splash__shape splash__shape--circle" aria-hidden="true"></div>
  <div class="splash__shape splash__shape--square" aria-hidden="true"></div>

  <div class="splash__card">
    <div class="splash__card-header" aria-hidden="true">
      <span class="splash__card-dot"></span>
      <span class="splash__card-dot"></span>
      <span class="splash__card-dot"></span>
    </div>

    <div class="splash__content">
      <svg class="splash__mark" viewBox="0 0 100 80" aria-hidden="true">
        <circle class="splash__mark-part splash__mark-part--yellow" cx="32" cy="44" r="24" />
        <path class="splash__mark-part splash__mark-part--white" d="M52 74 L72 16 L94 74 Z" />
        <rect
          class="splash__mark-part splash__mark-part--ink"
          x="42"
          y="6"
          width="20"
          height="20"
          rx="5"
          transform="rotate(14 52 16)"
        />
      </svg>

      <p class="splash__logo" aria-hidden="true">
        @for (letter of letters; track $index) {
          <span class="splash__letter" [style.--index]="$index">{{ letter }}</span>
        }
      </p>

      <svg class="splash__curve" viewBox="0 0 340 44" aria-hidden="true">
        <line class="splash__curve-handle" x1="12" y1="32" x2="70" y2="8" />
        <line class="splash__curve-handle" x1="328" y1="26" x2="250" y2="6" />
        <path class="splash__curve-path" pathLength="1" d="M12 32 C 70 8, 250 6, 328 26" />
        <circle class="splash__curve-point" cx="70" cy="8" r="4.5" />
        <circle class="splash__curve-point" cx="250" cy="6" r="4.5" />
        <rect class="splash__curve-anchor" x="6" y="26" width="12" height="12" rx="2" />
        <rect class="splash__curve-anchor" x="322" y="20" width="12" height="12" rx="2" />
      </svg>

      <div class="splash__badge" role="status">
        <span class="splash__badge-spinner" aria-hidden="true"></span>
        <span>Cargando dessin...</span>
      </div>
    </div>
  </div>
</div>
