<div class="brand-panel" aria-hidden="true">
  <div class="brand-panel__shape brand-panel__shape--circle"></div>
  <div class="brand-panel__shape brand-panel__shape--triangle"></div>
  <div class="brand-panel__shape brand-panel__shape--rectangle"></div>
  <div class="brand-panel__line"></div>

  <div class="brand-panel__text">
    <p class="brand-panel__headline">{{ headline() }}</p>
    <p class="brand-panel__description">{{ description() }}</p>
  </div>
</div>
