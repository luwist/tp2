<div class="auth-layout">
  <app-auth-illustration />

  <a class="auth-layout__logo" routerLink="/">dessin</a>

  <app-brand-panel
    class="auth-layout__brand"
    [headline]="headline()"
    [description]="description()"
  />

  <main class="auth-layout__content">
    <section class="auth-card" [class.auth-card--wide]="size() === 'wide'">
      @if (step()) {
        <p class="auth-card__step">{{ step() }}</p>
      }

      <h1 class="auth-card__title">{{ heading() }}</h1>

      <p class="auth-card__switch">
        {{ switchText() }}
        <a class="auth-card__link" [routerLink]="switchLinkPath()">{{ switchLinkText() }}</a>
      </p>

      <ng-content />
    </section>
  </main>
</div>
