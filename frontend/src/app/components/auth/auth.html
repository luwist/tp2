<div class="auth-layout">
  <app-brand-panel
    class="auth-layout__brand"
    [headline]="headline()"
    [description]="description()"
  />

  <main class="auth-layout__content">
    <a class="auth-layout__logo" routerLink="/">
      <img src="logo.svg" alt="Logo de la red social" />
    </a>

    <section class="auth-card" [class.auth-card--wide]="size() === 'wide'">
      <h1 class="auth-card__title">{{ heading() }}</h1>
      <p class="auth-card__subtitle">{{ subtitle() }}</p>

      <ng-content />
    </section>

    <p class="auth-layout__switch">
      {{ switchText() }}
      <a class="auth-layout__switch-link" [routerLink]="switchLinkPath()">{{ switchLinkText() }}</a>
    </p>
  </main>
</div>
