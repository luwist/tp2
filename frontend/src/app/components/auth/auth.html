<div class="auth-layout">
  <div class="auth-card" [class.auth-card--wide]="size() === 'wide'">
    <div class="auth-card__brand">
      <a class="auth-card__logo" routerLink="/">dessin</a>

      <app-brand-panel [headline]="headline()" [description]="description()" />
    </div>

    <main class="auth-card__content">
      @if (step()) {
        <p class="auth-card__step">{{ step() }}</p>
      }

      <h1 class="auth-card__title">{{ heading() }}</h1>

      <p class="auth-card__switch">
        {{ switchText() }}
        <a class="auth-card__link" [routerLink]="switchLinkPath()">{{ switchLinkText() }}</a>
      </p>

      <ng-content />
    </main>
  </div>
</div>
