<p-confirmdialog />
<p-toast position="top-center" />

<section class="posts-page">
  <aside class="posts-page__side posts-page__side--left">
    <app-profile-card />
  </aside>

  <div class="posts-page__feed" [attr.aria-busy]="isLoading()">
    <div class="posts-page__header">
      <h1 class="posts-page__title">Publicaciones</h1>

      <p-selectbutton
        [options]="sortOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="sortBy()"
        (onChange)="onSortChange($event)"
      />
    </div>
    @for (post of posts(); track post._id) {
      <app-post-card
        [post]="post"
        (click)="openPost(post)"
        (likeToggled)="onLikeToggled(post)"
        (deleteRequested)="onDeleteRequested($event)"
      />
    }

    @if (isLoadingMore()) {
      <app-post-card-skeleton />
    }

    @if (loadFailed() && !isLoading()) {
      <button type="button" class="posts-page__load-more" (click)="loadMore()">
        No se pudo cargar. Reintentar
      </button>
    } @else if (hasMore() && !isLoading() && !isLoadingMore()) {
      <div class="posts-page__sentinel" appInfiniteScroll (scrolled)="loadMore()"></div>
    }
  </div>

  <aside class="posts-page__side posts-page__side--right">
    <app-recent-posts-card [posts]="posts()" />
  </aside>
</section>
