<section class="users">
  <header class="users__toolbar">
    <p class="users__count">{{ users().length }} cuentas registradas</p>

    <p-button
      styleClass="users__create"
      label="Crear usuario"
      (onClick)="onCreateUser()"
      (created)="onUserCreated($event)"
    />
  </header>

  <p-table
    styleClass="users__table"
    dataKey="_id"
    [value]="users()"
    [paginator]="users().length > 10"
    [rows]="5"
  >
    <ng-template #header>
      <tr>
        <th>Usuario</th>
        <th>Rol</th>
        <th class="users__cell--status">Estado</th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr [class.users__row--disabled]="!user.isActive">
        <td>
          <div class="users__identity">
            <p-avatar
              styleClass="users__avatar"
              shape="circle"
              [image]="user.avatarUrl ?? undefined"
              [label]="user.avatarUrl ? undefined : getInitials(user)"
            />
            <span class="users__name">{{ user.firstName }} {{ user.lastName }}</span>
          </div>
        </td>

        <td>
          <p-tag
            styleClass="users__role"
            [rounded]="true"
            [severity]="roleSeverities[user.role]"
            [value]="roleLabels[user.role]"
          />
        </td>

        <td class="users__cell--status">
          <div class="users__status">
            <p-toggleswitch
              [ngModel]="user.isActive"
              (onChange)="onToggleEnabled(user, $event.checked)"
            />
            <span class="users__status-label">
              {{ user.isActive ? 'Habilitado' : 'Deshabilitado' }}
            </span>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="users__empty">Todavía no hay usuarios registrados.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<app-create-user [(visible)]="createDialogVisible" />
