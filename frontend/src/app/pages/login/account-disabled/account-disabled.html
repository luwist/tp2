<p-dialog
  styleClass="account-disabled__dialog"
  [closable]="false"
  [dismissableMask]="true"
  [draggable]="false"
  [modal]="true"
  [resizable]="false"
  [showHeader]="false"
  [style]="{ width: '28rem', maxWidth: '95vw' }"
  [visible]="visible()"
  (onHide)="closed.emit()"
  (visibleChange)="visible.set($event)"
>
  <div class="account-disabled">
    <svg
      class="account-disabled__illustration"
      aria-hidden="true"
      fill="none"
      viewBox="0 0 220 140"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle cx="44" cy="36" fill="#FFC531" r="22" stroke="#17171F" stroke-width="3" />
      <rect
        fill="#FFB3BC"
        height="38"
        rx="8"
        stroke="#17171F"
        stroke-width="3"
        transform="rotate(14 180 34)"
        width="38"
        x="161"
        y="15"
      />
      <path
        d="M26 128 52 88l26 40z"
        fill="#B8F0D8"
        stroke="#17171F"
        stroke-linejoin="round"
        stroke-width="3"
      />
      <circle cx="186" cy="108" fill="#D9CCFF" r="16" stroke="#17171F" stroke-width="3" />

      <path
        d="M92 62V50a18 18 0 0 1 36 0v12"
        stroke="#17171F"
        stroke-linecap="round"
        stroke-width="6"
      />
      <rect fill="#17171F" height="62" rx="12" width="64" x="82" y="68" />
      <rect
        fill="#FFC531"
        height="62"
        rx="12"
        stroke="#17171F"
        stroke-width="3"
        width="64"
        x="78"
        y="64"
      />
      <circle cx="110" cy="91" fill="#17171F" r="6" />
      <path d="M110 94v14" stroke="#17171F" stroke-linecap="round" stroke-width="5" />
    </svg>

    <h2 class="account-disabled__title">Tu cuenta está deshabilitada</h2>

    <p class="account-disabled__text">
      Un administrador desactivó el acceso a tu cuenta, por eso no podés ingresar por ahora. Si
      creés que es un error, comunicate con un administrador de dessin.
    </p>

    <p-button
      label="Entendido"
      styleClass="account-disabled__button"
      type="button"
      (onClick)="close()"
    />
  </div>
</p-dialog>
